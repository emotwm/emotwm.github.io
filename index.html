<style>
:root{--paper:#FFF;--ink:#1C1B19;--ink2:#6E6A62;--rule:#E6D9CB;--brand:#E8541E;--accent:#8A0F3C;--warn:#C25A00;--cream:#FFF8F1;--peach:#FFE9D6;
 --sans:"Noto Sans TC","Noto Sans CJK TC",-apple-system,"Microsoft JhengHei",sans-serif;--serif:"Noto Serif TC","Noto Serif CJK TC","Noto Sans TC",serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(60% 40% at 8% 100%,#FFD9BC 0,rgba(255,217,188,0) 70%),radial-gradient(55% 45% at 95% 100%,#FFD2AD 0,rgba(255,210,173,0) 70%),radial-gradient(40% 30% at 85% 12%,#FFE4CC 0,rgba(255,228,204,0) 70%),radial-gradient(35% 28% at 12% 20%,#FFEBDA 0,rgba(255,235,218,0) 70%);
 background-attachment:fixed}
header{background:rgba(255,255,255,.92);padding:10px 28px;box-shadow:0 1px 0 var(--rule);position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;flex-wrap:wrap;backdrop-filter:blur(8px)}
header .logo{height:62px;width:auto;display:block}
header .htitle{border-left:1px solid var(--rule);padding-left:18px}
header h1{font-family:var(--serif);font-weight:900;font-size:23px;margin:0;letter-spacing:.02em}
header .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.badge{font-size:15px;font-weight:700;background:var(--brand);color:#fff;padding:8px 16px;border-radius:6px}
/* 總部：切換店點 */
.actWrap{position:relative;display:inline-flex}
.actWrap select{appearance:none;-webkit-appearance:none;font:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--act,var(--brand));border:0;border-radius:6px;padding:8px 34px 8px 16px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.actWrap select option{color:#3B2A1E;background:#fff}
.actWrap::after{content:'';position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-6px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
.actWrap select:focus-visible{outline:3px solid rgba(232,84,30,.4);outline-offset:2px}
.actNote{display:inline-block;margin-top:10px;font-size:14px;color:#8A5A36;background:#FFF1E4;border:1px dashed #F5B98C;border-radius:8px;padding:6px 12px}
.actNote a{color:var(--brand);font-weight:700;margin-left:6px;cursor:pointer;text-decoration:underline}
.spacer{margin-left:auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #D9CFC2;background:#fff;color:var(--ink);padding:8px 16px;font-size:14px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:10px 20px 70px}

/* 主視覺 */
.hero{display:flex;align-items:center;gap:24px;padding:26px 10px 6px;min-height:230px}
.hero .txt{flex:1 1 420px}
.hero h2{font-family:var(--sans);font-weight:900;font-size:44px;line-height:1.2;margin:0 0 10px;letter-spacing:.01em}
.hero h2 em{font-style:normal;color:var(--brand)}
.hero p{font-size:19px;color:#4F4A42;margin:0}
.hero .pic{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;gap:6px}
.hero .mascot{height:230px;width:auto;filter:drop-shadow(0 10px 10px rgba(232,84,30,.18))}
.bubble{position:relative;background:#FFE8D3;border-radius:18px;padding:12px 18px;font-size:17px;line-height:1.5;color:#3B2A1E;font-weight:500;max-width:190px;margin-bottom:120px;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:-10px;bottom:16px;border:9px solid transparent;border-right-color:#FFE8D3;border-left:0}

/* 區塊標題 */
.sec{max-width:980px;margin:6px auto 0}
.sec h3{font-family:var(--sans);font-weight:900;font-size:30px;text-align:center;margin:8px 0 4px;position:relative}
.sec h3::before,.sec h3::after{content:"";display:inline-block;width:22px;height:3px;background:var(--brand);border-radius:2px;margin:0 14px;vertical-align:middle;transform:rotate(-30deg)}
.sec h3::after{transform:rotate(30deg)}
.hint{font-size:14px;color:var(--ink2);margin:0 0 18px;text-align:center}
.hint a{color:var(--accent);font-weight:500}

/* 卡片 */
.grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.grid .card{flex:0 1 300px}
.grid.two .card{flex:0 1 420px}
.card{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#fff;border:1px solid #F3E4D4;border-radius:18px;cursor:pointer;text-align:left;box-shadow:0 8px 20px rgba(201,120,60,.10);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(232,84,30,.18);border-color:#FFC7A3}
.card .shop{width:112px;height:auto;flex:none}
.card .ico{font-size:46px;line-height:1;flex:none;width:70px;text-align:center}
.card .txt{flex:1;min-width:0}
.card b{display:block;font-family:var(--serif);font-size:26px;font-weight:900;line-height:1.2}
.card small{display:block;font-size:14px;color:var(--ink2);margin-top:4px}
.card .arrow{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-size:26px;line-height:38px;text-align:center;font-weight:700}

/* 登入卡 */
.gate{max-width:360px;margin:10px auto;background:#fff;border:1px solid #F3E4D4;padding:22px 24px;border-radius:18px;box-shadow:0 8px 20px rgba(201,120,60,.10)}
.gate h3{font-family:var(--serif);font-size:19px;margin:0 0 12px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1px solid #D9CFC2;border-radius:8px;font:inherit;font-size:16px}
input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.err{color:var(--warn);font-size:13px;min-height:18px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}

@media (max-width:980px){.hero h2{font-size:34px}.hero .mascot{height:180px}.bubble{margin-bottom:90px;font-size:15px}}
@media (max-width:640px){header{padding:8px 14px;gap:10px}header .logo{height:42px}header .htitle{border:0;padding:0}header h1{font-size:18px}header .sub{display:none}
 .hero{flex-direction:row;align-items:flex-end;gap:6px;padding:14px 0 0;min-height:0}.hero .txt{flex:1 1 0}.hero h2{font-size:28px}.hero p{font-size:16px}.hero .mascot{height:110px}.bubble{display:none}
 .grid .card,.grid.two .card{flex:1 1 100%}.card{padding:14px 16px}.card .shop{width:84px}.card b{font-size:22px}.sec h3{font-size:24px}}
/* ══ 五家店：各自的店面圖與顏色 ══ */
.sec.wide{max-width:1180px}
#homeGrid .card{flex:0 1 352px;gap:10px;padding:14px 18px 14px 10px;border-color:transparent;background:var(--st-bg)}
#homeGrid .card .shop{width:168px}
#homeGrid .card .arrow{background:var(--st-c)}
#homeGrid .card:hover{border-color:var(--st-c);box-shadow:0 12px 26px var(--st-sh)}
.st-dingshan{--st-bg:#FEF5EE;--st-c:#FD732D;--st-sh:rgba(253,115,45,.22)}
.st-yangming{--st-bg:#FEFAEC;--st-c:#F7B031;--st-sh:rgba(247,176,49,.25)}
.st-houchang{--st-bg:#FEF2ED;--st-c:#FF6149;--st-sh:rgba(255,97,73,.22)}
.st-renxiong{--st-bg:#F6FBF5;--st-c:#5E9B53;--st-sh:rgba(94,155,83,.22)}
.st-kaixuan{--st-bg:#F0F9FE;--st-c:#4F96F1;--st-sh:rgba(79,150,241,.22)}
@media (max-width:640px){#homeGrid .card{flex:1 1 100%}#homeGrid .card .shop{width:120px}}
/* ══ 立體按鈕：底下一條較深的「厚度」，按下去會往下沉 ══ */
.card{border-bottom-width:1px;box-shadow:0 6px 0 #E8C8A8,0 14px 24px rgba(201,120,60,.16);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-3px);box-shadow:0 9px 0 #E8C8A8,0 20px 30px rgba(232,84,30,.20)}
.card:active{transform:translateY(5px);box-shadow:0 1px 0 #E8C8A8,0 4px 8px rgba(201,120,60,.14)}
.card .arrow{background:linear-gradient(180deg,#FF7A45 0%,var(--brand) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #B83D10,0 6px 10px rgba(184,61,16,.30)}
#homeGrid .card{box-shadow:0 6px 0 var(--st-d),0 14px 24px var(--st-sh)}
#homeGrid .card:hover{box-shadow:0 9px 0 var(--st-d),0 20px 30px var(--st-sh)}
#homeGrid .card:active{box-shadow:0 1px 0 var(--st-d),0 4px 8px var(--st-sh)}
#homeGrid .card .arrow{background:var(--st-c);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 var(--st-dd),0 6px 10px var(--st-sh)}
.st-dingshan{--st-d:#F2B994;--st-dd:#B8501A}
.st-yangming{--st-d:#EDCF82;--st-dd:#B57C10}
.st-houchang{--st-d:#F2AEA1;--st-dd:#BF3A26}
.st-renxiong{--st-d:#AFCFA8;--st-dd:#3F6E36}
.st-kaixuan{--st-d:#A6C6EE;--st-dd:#2B66B8}
button:not(.card){box-shadow:0 3px 0 #D9CFC2;transition:transform .1s,box-shadow .1s}
button:not(.card):active{transform:translateY(3px);box-shadow:0 0 0 #D9CFC2}
button.primary{background:linear-gradient(180deg,#FF7A45 0%,var(--brand) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 4px 0 #B83D10}
button.primary:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 #B83D10;transform:translateY(4px)}
.actWrap select{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,.22)}
.badge{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 #B83D10}
@media (prefers-reduced-motion:reduce){.card,.card:hover,.card:active,button:active{transform:none}}
/* ══ 滑過／按下會變色 ══ */
.card{transition:transform .12s,box-shadow .12s,background-color .15s,border-color .15s}
.card:hover{background:#FFF1E4;border-color:#FFC7A3}
.card:active{background:#FFE0C7;border-color:var(--brand)}
.card:hover .arrow{background:linear-gradient(180deg,#F0602A 0%,#C94414 100%)}
.card:active .arrow{background:#B83D10}
#homeGrid .card:hover{background:var(--st-h);border-color:var(--st-c)}
#homeGrid .card:active{background:var(--st-a);border-color:var(--st-dd)}
#homeGrid .card:hover .arrow,#homeGrid .card:active .arrow{background:var(--st-dd)}
.st-dingshan{--st-h:#FFE6D6;--st-a:#FDCDAF}
.st-yangming{--st-h:#FDF0C8;--st-a:#F8DE95}
.st-houchang{--st-h:#FFE0D9;--st-a:#FCC1B4}
.st-renxiong{--st-h:#E3F1E0;--st-a:#C6E1C0}
.st-kaixuan{--st-h:#DDEBFC;--st-a:#BBD6F7}
#homeGrid .card .shop{mix-blend-mode:multiply}   /* 店面圖跟著卡片底色一起變 */
button:not(.card){transition:transform .1s,box-shadow .1s,background-color .15s,border-color .15s,color .15s}
button:not(.card):not(.primary):hover{background:#FFF1E4;border-color:#F5B98C;color:var(--brand)}
button:not(.card):not(.primary):active{background:#FFE0C7}
button.primary:hover{background:linear-gradient(180deg,#F0602A 0%,#C94414 100%)}
button.primary:active{background:#B83D10}
.actWrap select:hover{filter:brightness(1.08)}
.actWrap select:active{filter:brightness(.9)}
/* ══ 吉祥物動畫：輕輕晃、泡泡彈出、點一下會跳 ══ */
.hero .mascot{transform-origin:50% 92%;animation:emoSway 3.6s ease-in-out infinite;cursor:pointer}
.hero .mascot.jump{animation:emoJump .6s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes emoSway{0%,100%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-7px) rotate(0deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-7px) rotate(0deg)}}
@keyframes emoJump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(4px) scale(1.06,.92)}55%{transform:translateY(-34px) scale(.96,1.05)}80%{transform:translateY(0) scale(1.04,.95)}100%{transform:translateY(0) scale(1,1)}}
.bubble{transform-origin:0% 85%;animation:emoPop .5s cubic-bezier(.3,1.6,.5,1) .25s both,emoFloat 4s ease-in-out .8s infinite}
.bubble.pop{animation:emoPop .45s cubic-bezier(.3,1.6,.5,1) both,emoFloat 4s ease-in-out .5s infinite}
@keyframes emoPop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes emoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.hero .mascot,.hero .mascot.jump,.bubble,.bubble.pop{animation:none}}
/* ══ 手機也看得到心情小語：泡泡放在吉祥物頭上 ══ */
@media (max-width:640px){
 .hero .pic{flex-direction:column-reverse;align-items:center;gap:0}
 .bubble{display:block;margin:0 0 10px;font-size:13px;line-height:1.45;padding:7px 11px;border-radius:14px;white-space:nowrap;max-width:none;text-align:center;transform-origin:50% 100%}
 .bubble::after{left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#FFE8D3;border-bottom:0}
}
/* ══ 吉祥物表情：臉是另外畫上去的，會跟著心情小語換表情、會眨眼 ══ */
.mwrap{display:inline-block;position:relative;line-height:0}
.mwrap .mimg{height:100%;width:auto;display:block}
.mface{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mface .face{transform-box:view-box;transform-origin:142px 108px;animation:faceIn .35s cubic-bezier(.3,1.6,.5,1)}
.mface .blink{transform-box:fill-box;transform-origin:50% 50%;animation:emoBlink 4.6s infinite}
@keyframes emoBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes faceIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.mface .face,.mface .blink{animation:none}}
/* ══ 每種表情有自己的動作＋小特效 ══ */
.hero .mascot[data-act=happy]{animation:actHop .9s ease-in-out infinite}
.hero .mascot[data-act=wink]{animation:actTilt 2.6s ease-in-out infinite}
.hero .mascot[data-act=calm]{animation:actBreath 4.8s ease-in-out infinite}
.hero .mascot[data-act=cheer]{animation:actPump .75s ease-in-out infinite}
.hero .mascot[data-act=love]{animation:actBeat 1.5s ease-in-out infinite}
.hero .mascot[data-act=wow]{animation:actStartle 3.2s ease-out infinite}
.hero .mascot.jump{animation:emoJump .6s cubic-bezier(.3,1.6,.5,1) 1!important}
@keyframes actHop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(2px) scale(1.04,.95)}45%{transform:translateY(-16px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.03,.97)}}
@keyframes actTilt{0%,100%{transform:rotate(0)}25%,60%{transform:rotate(7deg) translateY(-3px)}75%{transform:rotate(-2deg)}}
@keyframes actBreath{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,1.035)}}
@keyframes actPump{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
@keyframes actBeat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.07)}20%{transform:scale(.99)}30%{transform:scale(1.05)}}
@keyframes actStartle{0%{transform:translateY(0) scale(1)}6%{transform:translateY(-14px) scale(1.06,1.03)}14%{transform:translateY(0) scale(1)}18%{transform:rotate(-3deg)}22%{transform:rotate(3deg)}26%{transform:rotate(-2deg)}30%,100%{transform:rotate(0)}}
.mwrap .fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mwrap .fx span{position:absolute;font-size:26px;line-height:1;opacity:0;animation:fxUp 1.8s ease-out forwards}
@keyframes fxUp{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1;transform:translate(0,-10px) scale(1)}100%{opacity:0;transform:translate(var(--dx,0px),-70px) scale(1.1)}}
@media (max-width:640px){.mwrap .fx span{font-size:15px}}
@media (prefers-reduced-motion:reduce){.hero .mascot[data-act]{animation:none}.mwrap .fx{display:none}}
/* ══ 手腳會動：手腳是另外畫的，依表情換動作 ══ */
.mwrap .rig{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mwrap .rig g{transform-box:view-box}
#armL{transform-origin:68px 134px}#armR{transform-origin:214px 160px}#bcase{transform-origin:245px 198px}
#legL{transform-origin:128px 214px}#legR{transform-origin:162px 214px}
/* 一般：揮手、腳尖點地 */
.mascot[data-act=normal] #armL{animation:aWave 1.4s ease-in-out infinite}
.mascot[data-act=normal] #legR{animation:lTap 1.4s ease-in-out infinite}
.mascot[data-act=normal] #bcase{animation:cSwing 2.8s ease-in-out infinite}
/* 開心：快速揮手、雙腳輪流踢 */
.mascot[data-act=happy] #armL{animation:aWave .5s ease-in-out infinite}
.mascot[data-act=happy] #legL{animation:lKickL .45s ease-in-out infinite}
.mascot[data-act=happy] #legR{animation:lKickR .45s ease-in-out infinite}
.mascot[data-act=happy] #bcase{animation:cSwing .9s ease-in-out infinite}
/* 眨眼：舉手比讚的姿勢、單腳點地 */
.mascot[data-act=wink] #armL{animation:aSalute 2.6s ease-in-out infinite}
.mascot[data-act=wink] #legL{animation:lTapL 1.3s ease-in-out infinite}
/* 放鬆：手放下來慢慢擺 */
.mascot[data-act=calm] #armL{animation:aRest 4.8s ease-in-out infinite}
.mascot[data-act=calm] #armR{animation:aRestR 4.8s ease-in-out infinite}
.mascot[data-act=calm] #bcase{animation:cSwing 4.8s ease-in-out infinite}
/* 加油：握拳往上衝、原地踏步、公事包大力甩 */
.mascot[data-act=cheer] #armL{animation:aPump .38s ease-in-out infinite}
.mascot[data-act=cheer] #armR{animation:aPumpR .76s ease-in-out infinite}
.mascot[data-act=cheer] #legL{animation:lMarch .76s ease-in-out infinite}
.mascot[data-act=cheer] #legR{animation:lMarch .76s ease-in-out -.38s infinite}
.mascot[data-act=cheer] #bcase{animation:cSwingBig .76s ease-in-out infinite}
/* 感謝：慢慢揮手、一隻腳往後勾 */
.mascot[data-act=love] #armL{animation:aWave 2s ease-in-out infinite}
.mascot[data-act=love] #legL{animation:lCoy 3s ease-in-out infinite}
/* 提醒：兩手舉高、腳發抖 */
.mascot[data-act=wow] #armL{animation:aUp 3.2s ease-out infinite}
.mascot[data-act=wow] #armR{animation:aUpR 3.2s ease-out infinite}
.mascot[data-act=wow] #legL{animation:lShake 3.2s linear infinite}
.mascot[data-act=wow] #legR{animation:lShake 3.2s linear -.05s infinite}
.mascot[data-act=wow] #bcase{animation:cSwingBig 1.6s ease-in-out infinite}
@keyframes aWave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes aSalute{0%,100%{transform:rotate(22deg)}50%{transform:rotate(30deg)}}
@keyframes aRest{0%,100%{transform:rotate(-112deg)}50%{transform:rotate(-100deg)}}
@keyframes aRestR{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
@keyframes aPump{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-26deg)}}
@keyframes aPumpR{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-14deg)}}
@keyframes aUp{0%{transform:rotate(0)}8%,70%{transform:rotate(28deg)}100%{transform:rotate(0)}}
@keyframes aUpR{0%{transform:rotate(0)}8%,70%{transform:rotate(-62deg)}100%{transform:rotate(0)}}
@keyframes lTap{0%,40%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}}
@keyframes lTapL{0%,40%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}}
@keyframes lKickL{0%,100%{transform:rotate(0)}50%{transform:rotate(22deg)}}
@keyframes lKickR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(0)}}
@keyframes lMarch{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(-6deg)}}
@keyframes lCoy{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(32deg) translateY(-4px)}}
@keyframes lShake{0%,10%,30%,100%{transform:translateX(0)}12%,16%,20%,24%{transform:translateX(-2px)}14%,18%,22%,26%{transform:translateX(2px)}}
@keyframes cSwing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes cSwingBig{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@media (prefers-reduced-motion:reduce){.mwrap .rig g{animation:none!important}}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
function accountOf(k){for(const a in ACCOUNTS)if(ACCOUNTS[a]===k)return a;return '';}
function loginEmail(id){if(id==='admin')return 'admin@store.local';if(ACCOUNTS[id])return 's'+id+'@store.local';return id;}

/* ══════════ 登入（跟到貨貼標同一套） ══════════ */
const CloudDB={sb:null,async init(){
  if(this.sb)return;
  await new Promise((res,rej)=>{const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    sc.onload=res;sc.onerror=()=>rej(new Error('無法載入雲端元件，請確認網路'));document.head.appendChild(sc);});
  this.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
}};
const AUTH={
  role:'',store:'',
  async init(){
    if(!CLOUD){try{const r=sessionStorage.getItem('bc:role');if(r){this.role=r;this.store=sessionStorage.getItem('bc:store')||'';}}catch(e){}return;}
    await CloudDB.init();
    const {data}=await CloudDB.sb.auth.getSession();
    this.apply(data&&data.session);
  },
  apply(sess){const m=(sess&&sess.user&&sess.user.user_metadata)||{};this.role=sess?(m.role==='admin'?'admin':'store'):'';this.store=m.store||'';},
  async login(id,pw){
    if(!CLOUD){
      if(id==='admin'&&pw==='admin'){this.role='admin';this.store='';}
      else if(ACCOUNTS[id]&&pw==='0000'){this.role='store';this.store=ACCOUNTS[id];}
      else throw new Error('帳號或密碼不對');
      try{sessionStorage.setItem('bc:role',this.role);sessionStorage.setItem('bc:store',this.store);}catch(e){}
      return;
    }
    const {data,error}=await CloudDB.sb.auth.signInWithPassword({email:loginEmail(id),password:pw});
    if(error)throw new Error('帳號或密碼不對');
    this.apply(data&&data.session);
  },
  async logout(){
    this.role='';this.store='';
    if(CLOUD)await CloudDB.sb.auth.signOut();
    else{try{sessionStorage.removeItem('bc:role');sessionStorage.removeItem('bc:store');}catch(e){}}
  },
  isAdmin(){return this.role==='admin';}
};

/* ══════════ 共用登入狀態：子系統（到貨貼標、進貨單）都讀這個 ══════════ */
/* 總部「切換店點」：ACT = 正在代看的店（空白 = 總部本身） */
let ACT='';
const ACT_COLOR={dingshan:'#FD732D',yangming:'#E9A21F',houchang:'#FF6149',renxiong:'#5E9B53',kaixuan:'#4F96F1'};
function ssoSave(){
  if(AUTH.isAdmin()&&ACT&&STORE_KEYS[ACT]){
    try{localStorage.setItem('emo:sso',JSON.stringify({
      role:'store',store:STORE_KEYS[ACT],storeKey:ACT,account:accountOf(ACT),
      actingAdmin:true,at:Date.now()}));}catch(e){}
    return;
  }
  try{localStorage.setItem('emo:sso',JSON.stringify({
    role:AUTH.isAdmin()?'admin':'store',
    store:AUTH.isAdmin()?'':(STORE_KEYS[AUTH.store]||''),
    storeKey:AUTH.isAdmin()?'':AUTH.store,
    account:AUTH.isAdmin()?'admin':accountOf(AUTH.store),
    at:Date.now()}));}catch(e){}
}
function ssoClear(){try{localStorage.removeItem('emo:sso');}catch(e){}}

/* ══════════ 畫面 ══════════ */
let VIEW='home',GATESTORE='';
function show(id){for(const s of ['home','gate','menu'])$(s).hidden=s!==id;}
function render(){
  const admin=AUTH.isAdmin(),logged=!!AUTH.role;
  $('switchBtn').hidden=!(logged&&!admin&&VIEW==='menu');
  $('actWrap').hidden=!(logged&&admin&&VIEW==='menu');
  $('badge').hidden=!$('actWrap').hidden;
  if(!admin)ACT='';
  $('logoutBtn').hidden=!(logged&&VIEW==='menu');
  if(logged&&VIEW==='menu'){
    const acting=admin&&!!ACT;
    const nm=acting?STORE_KEYS[ACT]:(admin?'總部':(STORE_KEYS[AUTH.store]||'門市'));
    $('badge').textContent=nm;$('menuTitle').textContent='選一個功能';
    if(admin){
      $('actSel').innerHTML='<option value="">總部</option>'+Object.keys(STORE_KEYS).map(k=>'<option value="'+k+'">'+esc(STORE_KEYS[k])+'</option>').join('');
      $('actSel').value=ACT;$('actWrap').style.setProperty('--act',acting?ACT_COLOR[ACT]:'');
    }
    const r=(admin&&!acting)?'admin':'store', pick=v=>typeof v==='string'?v:(v[r]||'');
    $('heroTitle').innerHTML=esc(nm)+'，<em>要做什麼？</em>';
    if(acting){$('heroSub').innerHTML='<span class="actNote">你現在是<b>總部</b>，用'+esc(nm)+'的畫面操作<a id="actBack">切回總部</a></span>';$('actBack').onclick=()=>setAct('');}
    else $('heroSub').textContent=admin?'點上方的「總部 ▾」可以切換成任何一間店的畫面。':'登入一次就好，點進去不用再輸密碼。';
    $('menuGrid').innerHTML=APPS.filter(a=>a.ready).map(a=>'<button class="card" data-url="'+esc(pick(a.url))+'">'
      +'<span class="ico">'+a.ico+'</span><span class="txt"><b>'+esc(pick(a.name))+'</b><small>'+esc(pick(a.desc))+'</small></span><span class="arrow">›</span></button>').join('');
    $('menuGrid').querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>{ssoSave();location.href=b.dataset.url;});
    ssoSave();show('menu');return;
  }
  if(VIEW==='gate'){
    $('badge').textContent=GATESTORE?STORE_KEYS[GATESTORE]:'總部';
    $('gateTitle').textContent=GATESTORE?(STORE_KEYS[GATESTORE]+'　第一次使用請登入'):'總部登入';
    $('uid').value=GATESTORE?accountOf(GATESTORE):'';$('uidRow').hidden=!!GATESTORE;$('pw').value='';$('gateErr').textContent='';
    $('gateHint').textContent=GATESTORE?'這台電腦第一次開這間店，請輸入門市密碼；之後點店名就會直接進入。':(CLOUD?'請輸入總部帳號密碼。':'測試版：總部 admin / admin；門市密碼 0000。');
    $('heroTitle').innerHTML=GATESTORE?(esc(STORE_KEYS[GATESTORE])+'，<em>第一次使用</em>'):'<em>總部</em>登入';$('heroSub').textContent=GATESTORE?'輸入一次門市密碼，之後這台電腦就記住了。':'請輸入總部帳號密碼。';
    show('gate');setTimeout(()=>$(GATESTORE?'pw':'uid').focus(),50);return;
  }
  $('badge').textContent='選擇店點';
  $('heroTitle').innerHTML='歡迎使用<em>倚盟工具箱</em>！';$('heroSub').textContent='選擇你的工作門市，開啟今天的工作吧。';
  $('homeGrid').innerHTML=Object.keys(STORE_KEYS).map(k=>'<button class="card st-'+k+'" data-k="'+k+'"><img class="shop" src="'+(SHOPS[k]||SHOP)+'" alt="">'
    +'<span class="txt"><b>'+esc(STORE_KEYS[k])+'</b><small>#'+accountOf(k)+(AUTH.role==='store'&&AUTH.store===k?'・這台電腦':'')+'</small></span><span class="arrow">›</span></button>').join('');
  $('homeGrid').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>goStore(b.dataset.k));
  show('home');
}
function goStore(k){
  if(AUTH.role==='store'&&AUTH.store===k){VIEW='menu';render();return;}
  GATESTORE=k;VIEW='gate';render();
}
function goHome(){VIEW='home';GATESTORE='';ACT='';ssoClear();render();}
function setAct(k){ACT=STORE_KEYS[k]?k:'';ssoSave();render();toast(ACT?('已切換成 '+STORE_KEYS[ACT]+' 的畫面'):'已切回總部');}
$('actSel').onchange=e=>setAct(e.target.value);
$('hqLink').onclick=e=>{e.preventDefault();GATESTORE='';VIEW='gate';render();};
$('gateBack').onclick=()=>goHome();
$('switchBtn').onclick=()=>goHome();   /* 換店點：不登出，回選店點 */
$('logoutBtn').onclick=async()=>{await AUTH.logout();ssoClear();goHome();};
$('pwGo').onclick=async()=>{
  $('pwGo').disabled=true;$('gateErr').textContent='';
  try{await AUTH.login($('uid').value.trim(),$('pw').value);VIEW='menu';render();}
  catch(e){$('gateErr').textContent=e.message;}
  $('pwGo').disabled=false;
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('pwGo').click();});
$('uid').addEventListener('keydown',e=>{if(e.key==='Enter')$('pw').focus();});

/* ══════════ 啟動 ══════════ */
(async function(){
  const p=new URLSearchParams(location.search);
  try{await AUTH.init();}catch(e){toast(e.message);}
  if(p.get('logout')==='1'){try{await AUTH.logout();}catch(e){}ssoClear();try{history.replaceState(null,'',location.pathname);}catch(e){}}
  if(AUTH.role)VIEW='menu';   /* 這台電腦已經登入過，直接到選單 */
  if(AUTH.isAdmin()){try{const r=JSON.parse(localStorage.getItem('emo:sso')||'null');if(r&&r.actingAdmin&&STORE_KEYS[r.storeKey])ACT=r.storeKey;}catch(e){}}
  render();
})();
</script>
<style>.logoHome{cursor:pointer;transition:opacity .15s}.logoHome:hover{opacity:.8}.logoHome:focus-visible{outline:3px solid rgba(232,84,30,.45);outline-offset:3px;border-radius:6px}</style>
<script>/* 點 logo 回「倚盟工具箱」首頁 */
(function(){document.querySelectorAll('header .logo').forEach(function(el){
  el.classList.add('logoHome');el.title='回工具箱首頁';el.setAttribute('role','link');el.tabIndex=0;
  function go(){if(AUTH.role){VIEW='menu';GATESTORE='';}else{VIEW='home';GATESTORE='';}render();window.scrollTo({top:0,behavior:'smooth'});}
  el.addEventListener('click',go);
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
});})();
</script>
<script>document.addEventListener('touchstart',function(){}, {passive:true});</script>
<script>
/* ══ 心情小語：每次打開換一句，點泡泡也會換 ══
   要新增就照格式加一行：t＝句子（用 | 分行，每行 9 個字以內比較好看），f＝表情（normal 一般、happy 開心、wink 眨眼、calm 放鬆、cheer 加油、love 感謝、wow 提醒） */
const MOODS=[{"t": "一起|讓工作更輕鬆！ 🧡", "f": "happy"}, {"t": "今天也|辛苦了！ 🙇", "f": "calm"}, {"t": "先喝口水|再出發 💧", "f": "normal"}, {"t": "慢慢來|比較快 🐢", "f": "calm"}, {"t": "你的笑容|是最好的服務 😊", "f": "happy"}, {"t": "每一位客人|都是緣分 🤝", "f": "love"}, {"t": "做得很好|繼續保持！ 👏", "f": "wink"}, {"t": "有問題|隨時找總部喔 📞", "f": "wink"}, {"t": "今天也是|好業績的一天！ 📈", "f": "cheer"}, {"t": "深呼吸|一切都會順利 🌿", "f": "calm"}, {"t": "團隊合作|力量最大 💪", "f": "cheer"}, {"t": "記得吃飯|身體要顧好 🍱", "f": "love"}, {"t": "小事做好|就是大事 ✨", "f": "normal"}, {"t": "謝謝你|今天也很努力 🙏", "f": "love"}, {"t": "笑一個|好運會來 🍀", "f": "happy"}, {"t": "一步一步|穩穩地走 👣", "f": "calm"}, {"t": "把握當下|全力以赴！ 🔥", "f": "cheer"}, {"t": "心情好|工作就順 🎵", "f": "happy"}, {"t": "每天進步|一點點 🌱", "f": "normal"}, {"t": "加油！|我們都在 🧡", "f": "cheer"}, {"t": "休息一下|也很重要 ☕", "f": "calm"}, {"t": "有你在|真好 🥰", "f": "love"}, {"t": "今天的努力|明天看得到 🌈", "f": "wink"}, {"t": "別忘了|給自己按個讚 👍", "f": "wink"}, {"t": "天氣再怎樣|心情要晴朗 ☀️", "f": "happy"}, {"t": "貨到了？|記得印標籤喔 📦", "f": "wow"}, {"t": "進貨單|拍清楚一點喔 📷", "f": "wow"}, {"t": "忙歸忙|也要記得喝水 🥤", "f": "normal"}];

/* 表情：normal 一般、happy 開心、wink 眨眼、calm 放鬆、cheer 加油、love 感謝、wow 提醒 */
const INK='#21150F',BLUSH='<ellipse cx="104" cy="118" rx="10" ry="6" fill="#FF8A7A" opacity=".55"/><ellipse cx="176" cy="122" rx="10" ry="6" fill="#FF8A7A" opacity=".55"/>';
const EYE=(x,y)=>'<ellipse class="blink" cx="'+x+'" cy="'+y+'" rx="6.5" ry="11" fill="'+INK+'"/>';
const EYEHI=(x,y)=>'<g class="blink"><ellipse cx="'+x+'" cy="'+y+'" rx="7.5" ry="12" fill="'+INK+'"/><circle cx="'+(x+2.5)+'" cy="'+(y-4.5)+'" r="3" fill="#fff"/></g>';
const ARC=(x,y)=>'<path d="M'+(x-8)+','+(y+4)+' Q'+x+','+(y-10)+' '+(x+8)+','+(y+4)+'" fill="none" stroke="'+INK+'" stroke-width="4.5" stroke-linecap="round"/>';
const SHUT=(x,y)=>'<path d="M'+(x-8)+','+(y-3)+' Q'+x+','+(y+7)+' '+(x+8)+','+(y-3)+'" fill="none" stroke="'+INK+'" stroke-width="4.5" stroke-linecap="round"/>';
const SMILE='<path d="M131,124 Q141,133 151,126" fill="none" stroke="'+INK+'" stroke-width="3.5" stroke-linecap="round"/>';
const GRIN='<path d="M127,121 Q141,143 156,123 Z" fill="'+INK+'" stroke="'+INK+'" stroke-width="2" stroke-linejoin="round"/><path d="M134,131 Q142,137 149,130 Q142,128 134,131 Z" fill="#FF7B6B"/>';
const FACES={
  normal:EYE(122,98)+EYE(156,102)+SMILE,
  happy:ARC(122,98)+ARC(156,102)+GRIN,
  wink:EYE(122,98)+ARC(156,102)+SMILE,
  calm:SHUT(122,98)+SHUT(156,102)+SMILE+BLUSH,
  cheer:'<path d="M112,82 Q121,76 130,81" fill="none" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/><path d="M147,86 Q156,80 165,85" fill="none" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/>'+EYEHI(122,99)+EYEHI(156,103)+GRIN,
  love:EYEHI(122,98)+EYEHI(156,102)+SMILE+BLUSH,
  wow:EYEHI(122,96)+EYEHI(156,100)+'<ellipse cx="141" cy="128" rx="5" ry="6.5" fill="'+INK+'"/>'
};
function setFace(f){const sv=document.getElementById('mface');if(sv)sv.innerHTML='<g class="face">'+(FACES[f]||FACES.normal)+'</g>';
  const m=document.querySelector('.hero .mascot');if(m)m.dataset.act=f;startFx(f);}
/* 小特效：從吉祥物頭上冒出來的符號 */
const FX={happy:['✨','🎵'],wink:['✨'],calm:['🍃'],cheer:['⭐','🔥'],love:['💕','❤️'],wow:['❗']};
let fxTimer=null;
function startFx(f){
  clearInterval(fxTimer);const box=document.getElementById('mfx');if(!box)return;box.innerHTML='';
  const set=FX[f];if(!set)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const one=()=>{if(document.hidden)return;const sp=document.createElement('span');sp.textContent=set[Math.floor(Math.random()*set.length)];
    sp.style.left=(30+Math.random()*40)+'%';sp.style.top=(f==='wow'?8:18)+'%';sp.style.setProperty('--dx',(Math.random()*40-20)+'px');
    box.appendChild(sp);setTimeout(()=>sp.remove(),1900);};
  one();fxTimer=setInterval(one,f==='wow'?3200:(f==='calm'?2400:1100));
}
(function(){
  const el=document.getElementById('bubble');if(!el)return;
  let last=-1;try{last=+localStorage.getItem('emo:mood');}catch(e){}
  function pick(){let i;do{i=Math.floor(Math.random()*MOODS.length);}while(MOODS.length>1&&i===last);last=i;
    try{localStorage.setItem('emo:mood',String(i));}catch(e){}
    el.innerHTML=MOODS[i].t.split('|').map(t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');setFace(MOODS[i].f);}
  function popNew(){pick();el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  pick();
  el.style.cursor='pointer';el.addEventListener('click',popNew);
  /* 點吉祥物：跳一下＋換一句 */
  const m=document.querySelector('.hero .mascot');
  if(m){m.title='點我一下';m.addEventListener('animationend',e=>{if(e.animationName==='emoJump')m.classList.remove('jump');});
    m.addEventListener('click',()=>{m.classList.remove('jump');void m.offsetWidth;m.classList.add('jump');popNew();});}
})();
</script>
