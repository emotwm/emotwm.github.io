<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倚盟工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF;--ink:#1C1B19;--ink2:#6E6A62;--rule:#E6D9CB;--brand:#E8541E;--accent:#8A0F3C;--warn:#C25A00;--cream:#FFF8F1;--peach:#FFE9D6;
 --sans:"Noto Sans TC","Noto Sans CJK TC",-apple-system,"Microsoft JhengHei",sans-serif;--serif:"Noto Serif TC","Noto Serif CJK TC","Noto Sans TC",serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(60% 40% at 8% 100%,#FFD9BC 0,rgba(255,217,188,0) 70%),radial-gradient(55% 45% at 95% 100%,#FFD2AD 0,rgba(255,210,173,0) 70%),radial-gradient(40% 30% at 85% 12%,#FFE4CC 0,rgba(255,228,204,0) 70%),radial-gradient(35% 28% at 12% 20%,#FFEBDA 0,rgba(255,235,218,0) 70%);
 background-attachment:fixed}
header{background:rgba(255,255,255,.92);padding:10px 28px;box-shadow:0 1px 0 var(--rule);position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;flex-wrap:wrap;backdrop-filter:blur(8px)}
header .logo{height:62px;width:auto;display:block}
header .htitle{border-left:1px solid var(--rule);padding-left:18px}
header h1{font-family:var(--serif);font-weight:900;font-size:23px;margin:0;letter-spacing:.02em}
header .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.badge{font-size:15px;font-weight:700;background:var(--brand);color:#fff;padding:8px 16px;border-radius:6px}
.spacer{margin-left:auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #D9CFC2;background:#fff;color:var(--ink);padding:8px 16px;font-size:14px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:10px 20px 70px}

/* 主視覺 */
.hero{display:flex;align-items:center;gap:24px;padding:26px 10px 6px;min-height:230px}
.hero .txt{flex:1 1 420px}
.hero h2{font-family:var(--sans);font-weight:900;font-size:44px;line-height:1.2;margin:0 0 10px;letter-spacing:.01em}
.hero h2 em{font-style:normal;color:var(--brand)}
.hero p{font-size:19px;color:#4F4A42;margin:0}
.hero .pic{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;gap:6px}
.hero .mascot{height:230px;width:auto;filter:drop-shadow(0 10px 10px rgba(232,84,30,.18))}
.bubble{position:relative;background:#FFE8D3;border-radius:18px;padding:12px 18px;font-size:17px;line-height:1.5;color:#3B2A1E;font-weight:500;max-width:190px;margin-bottom:120px;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:-10px;bottom:16px;border:9px solid transparent;border-right-color:#FFE8D3;border-left:0}

/* 區塊標題 */
.sec{max-width:980px;margin:6px auto 0}
.sec h3{font-family:var(--sans);font-weight:900;font-size:30px;text-align:center;margin:8px 0 4px;position:relative}
.sec h3::before,.sec h3::after{content:"";display:inline-block;width:22px;height:3px;background:var(--brand);border-radius:2px;margin:0 14px;vertical-align:middle;transform:rotate(-30deg)}
.sec h3::after{transform:rotate(30deg)}
.hint{font-size:14px;color:var(--ink2);margin:0 0 18px;text-align:center}
.hint a{color:var(--accent);font-weight:500}

/* 卡片 */
.grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.grid .card{flex:0 1 300px}
.grid.two .card{flex:0 1 420px}
.card{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#fff;border:1px solid #F3E4D4;border-radius:18px;cursor:pointer;text-align:left;box-shadow:0 8px 20px rgba(201,120,60,.10);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(232,84,30,.18);border-color:#FFC7A3}
.card .shop{width:112px;height:auto;flex:none}
.card .ico{font-size:46px;line-height:1;flex:none;width:70px;text-align:center}
.card .txt{flex:1;min-width:0}
.card b{display:block;font-family:var(--serif);font-size:26px;font-weight:900;line-height:1.2}
.card small{display:block;font-size:14px;color:var(--ink2);margin-top:4px}
.card .arrow{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-size:26px;line-height:38px;text-align:center;font-weight:700}

/* 登入卡 */
.gate{max-width:360px;margin:10px auto;background:#fff;border:1px solid #F3E4D4;padding:22px 24px;border-radius:18px;box-shadow:0 8px 20px rgba(201,120,60,.10)}
.gate h3{font-family:var(--serif);font-size:19px;margin:0 0 12px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1px solid #D9CFC2;border-radius:8px;font:inherit;font-size:16px}
input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.err{color:var(--warn);font-size:13px;min-height:18px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}

@media (max-width:980px){.hero h2{font-size:34px}.hero .mascot{height:180px}.bubble{margin-bottom:90px;font-size:15px}}
@media (max-width:640px){header{padding:8px 14px;gap:10px}header .logo{height:42px}header .htitle{border:0;padding:0}header h1{font-size:18px}header .sub{display:none}
 .hero{flex-direction:row;align-items:flex-end;gap:6px;padding:14px 0 0;min-height:0}.hero .txt{flex:1 1 0}.hero h2{font-size:28px}.hero p{font-size:16px}.hero .mascot{height:110px}.bubble{display:none}
 .grid .card,.grid.two .card{flex:1 1 100%}.card{padding:14px 16px}.card .shop{width:84px}.card b{font-size:22px}.sec h3{font-size:24px}}
/* ══ 五家店：各自的店面圖與顏色 ══ */
.sec.wide{max-width:1180px}
#homeGrid .card{flex:0 1 352px;gap:10px;padding:14px 18px 14px 10px;border-color:transparent;background:var(--st-bg)}
#homeGrid .card .shop{width:168px}
#homeGrid .card .arrow{background:var(--st-c)}
#homeGrid .card:hover{border-color:var(--st-c);box-shadow:0 12px 26px var(--st-sh)}
.st-dingshan{--st-bg:#FEF5EE;--st-c:#FD732D;--st-sh:rgba(253,115,45,.22)}
.st-yangming{--st-bg:#FEFAEC;--st-c:#F7B031;--st-sh:rgba(247,176,49,.25)}
.st-houchang{--st-bg:#FEF2ED;--st-c:#FF6149;--st-sh:rgba(255,97,73,.22)}
.st-renxiong{--st-bg:#F6FBF5;--st-c:#5E9B53;--st-sh:rgba(94,155,83,.22)}
.st-kaixuan{--st-bg:#F0F9FE;--st-c:#4F96F1;--st-sh:rgba(79,150,241,.22)}
@media (max-width:640px){#homeGrid .card{flex:1 1 100%}#homeGrid .card .shop{width:120px}}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
function accountOf(k){for(const a in ACCOUNTS)if(ACCOUNTS[a]===k)return a;return '';}
function loginEmail(id){if(id==='admin')return 'admin@store.local';if(ACCOUNTS[id])return 's'+id+'@store.local';return id;}

/* ══════════ 登入（跟到貨貼標同一套） ══════════ */
const CloudDB={sb:null,async init(){
  if(this.sb)return;
  await new Promise((res,rej)=>{const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    sc.onload=res;sc.onerror=()=>rej(new Error('無法載入雲端元件，請確認網路'));document.head.appendChild(sc);});
  this.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
}};
const AUTH={
  role:'',store:'',
  async init(){
    if(!CLOUD){try{const r=sessionStorage.getItem('bc:role');if(r){this.role=r;this.store=sessionStorage.getItem('bc:store')||'';}}catch(e){}return;}
    await CloudDB.init();
    const {data}=await CloudDB.sb.auth.getSession();
    this.apply(data&&data.session);
  },
  apply(sess){const m=(sess&&sess.user&&sess.user.user_metadata)||{};this.role=sess?(m.role==='admin'?'admin':'store'):'';this.store=m.store||'';},
  async login(id,pw){
    if(!CLOUD){
      if(id==='admin'&&pw==='admin'){this.role='admin';this.store='';}
      else if(ACCOUNTS[id]&&pw==='0000'){this.role='store';this.store=ACCOUNTS[id];}
      else throw new Error('帳號或密碼不對');
      try{sessionStorage.setItem('bc:role',this.role);sessionStorage.setItem('bc:store',this.store);}catch(e){}
      return;
    }
    const {data,error}=await CloudDB.sb.auth.signInWithPassword({email:loginEmail(id),password:pw});
    if(error)throw new Error('帳號或密碼不對');
    this.apply(data&&data.session);
  },
  async logout(){
    this.role='';this.store='';
    if(CLOUD)await CloudDB.sb.auth.signOut();
    else{try{sessionStorage.removeItem('bc:role');sessionStorage.removeItem('bc:store');}catch(e){}}
  },
  isAdmin(){return this.role==='admin';}
};

/* ══════════ 共用登入狀態：子系統（到貨貼標、進貨單）都讀這個 ══════════ */
function ssoSave(){
  try{localStorage.setItem('emo:sso',JSON.stringify({
    role:AUTH.isAdmin()?'admin':'store',
    store:AUTH.isAdmin()?'':(STORE_KEYS[AUTH.store]||''),
    storeKey:AUTH.isAdmin()?'':AUTH.store,
    account:AUTH.isAdmin()?'admin':accountOf(AUTH.store),
    at:Date.now()}));}catch(e){}
}
function ssoClear(){try{localStorage.removeItem('emo:sso');}catch(e){}}

/* ══════════ 畫面 ══════════ */
let VIEW='home',GATESTORE='';
function show(id){for(const s of ['home','gate','menu'])$(s).hidden=s!==id;}
function render(){
  const admin=AUTH.isAdmin(),logged=!!AUTH.role;
  $('switchBtn').hidden=!(logged&&!admin&&VIEW==='menu');
  $('logoutBtn').hidden=!(logged&&VIEW==='menu');
  if(logged&&VIEW==='menu'){
    const nm=admin?'總部':(STORE_KEYS[AUTH.store]||'門市');
    $('badge').textContent=nm;$('menuTitle').textContent='選一個功能';
    const r=admin?'admin':'store', pick=v=>typeof v==='string'?v:(v[r]||'');
    $('heroTitle').innerHTML=esc(nm)+'，<em>要做什麼？</em>';$('heroSub').textContent='登入一次就好，點進去不用再輸密碼。';
    $('menuGrid').innerHTML=APPS.filter(a=>a.ready).map(a=>'<button class="card" data-url="'+esc(a.url)+'">'
      +'<span class="ico">'+a.ico+'</span><span class="txt"><b>'+esc(pick(a.name))+'</b><small>'+esc(pick(a.desc))+'</small></span><span class="arrow">›</span></button>').join('');
    $('menuGrid').querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>{ssoSave();location.href=b.dataset.url;});
    ssoSave();show('menu');return;
  }
  if(VIEW==='gate'){
    $('badge').textContent=GATESTORE?STORE_KEYS[GATESTORE]:'總部';
    $('gateTitle').textContent=GATESTORE?(STORE_KEYS[GATESTORE]+'　第一次使用請登入'):'總部登入';
    $('uid').value=GATESTORE?accountOf(GATESTORE):'';$('uidRow').hidden=!!GATESTORE;$('pw').value='';$('gateErr').textContent='';
    $('gateHint').textContent=GATESTORE?'這台電腦第一次開這間店，請輸入門市密碼；之後點店名就會直接進入。':(CLOUD?'請輸入總部帳號密碼。':'測試版：總部 admin / admin；門市密碼 0000。');
    $('heroTitle').innerHTML=GATESTORE?(esc(STORE_KEYS[GATESTORE])+'，<em>第一次使用</em>'):'<em>總部</em>登入';$('heroSub').textContent=GATESTORE?'輸入一次門市密碼，之後這台電腦就記住了。':'請輸入總部帳號密碼。';
    show('gate');setTimeout(()=>$(GATESTORE?'pw':'uid').focus(),50);return;
  }
  $('badge').textContent='選擇店點';
  $('heroTitle').innerHTML='歡迎使用<em>倚盟工具箱</em>！';$('heroSub').textContent='選擇你的工作門市，開啟今天的工作吧。';
  $('homeGrid').innerHTML=Object.keys(STORE_KEYS).map(k=>'<button class="card st-'+k+'" data-k="'+k+'"><img class="shop" src="'+(SHOPS[k]||SHOP)+'" alt="">'
    +'<span class="txt"><b>'+esc(STORE_KEYS[k])+'</b><small>#'+accountOf(k)+(AUTH.role==='store'&&AUTH.store===k?'・這台電腦':'')+'</small></span><span class="arrow">›</span></button>').join('');
  $('homeGrid').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>goStore(b.dataset.k));
  show('home');
}
function goStore(k){
  if(AUTH.role==='store'&&AUTH.store===k){VIEW='menu';render();return;}
  GATESTORE=k;VIEW='gate';render();
}
function goHome(){VIEW='home';GATESTORE='';ssoClear();render();}
$('hqLink').onclick=e=>{e.preventDefault();GATESTORE='';VIEW='gate';render();};
$('gateBack').onclick=()=>goHome();
$('switchBtn').onclick=()=>goHome();   /* 換店點：不登出，回選店點 */
$('logoutBtn').onclick=async()=>{await AUTH.logout();ssoClear();goHome();};
$('pwGo').onclick=async()=>{
  $('pwGo').disabled=true;$('gateErr').textContent='';
  try{await AUTH.login($('uid').value.trim(),$('pw').value);VIEW='menu';render();}
  catch(e){$('gateErr').textContent=e.message;}
  $('pwGo').disabled=false;
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('pwGo').click();});
$('uid').addEventListener('keydown',e=>{if(e.key==='Enter')$('pw').focus();});

/* ══════════ 啟動 ══════════ */
(async function(){
  const p=new URLSearchParams(location.search);
  try{await AUTH.init();}catch(e){toast(e.message);}
  if(p.get('logout')==='1'){try{await AUTH.logout();}catch(e){}ssoClear();try{history.replaceState(null,'',location.pathname);}catch(e){}}
  if(AUTH.role)VIEW='menu';   /* 這台電腦已經登入過，直接到選單 */
  render();
})();
</script>
<style>.logoHome{cursor:pointer;transition:opacity .15s}.logoHome:hover{opacity:.8}.logoHome:focus-visible{outline:3px solid rgba(232,84,30,.45);outline-offset:3px;border-radius:6px}</style>
<script>/* 點 logo 回「倚盟工具箱」首頁 */
(function(){document.querySelectorAll('header .logo').forEach(function(el){
  el.classList.add('logoHome');el.title='回工具箱首頁';el.setAttribute('role','link');el.tabIndex=0;
  function go(){if(AUTH.role){VIEW='menu';GATESTORE='';}else{VIEW='home';GATESTORE='';}render();window.scrollTo({top:0,behavior:'smooth'});}
  el.addEventListener('click',go);
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
});})();
</script>
</body>
</html>
